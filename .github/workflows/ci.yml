name: Validate Rules & Repo

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and validate security rules index
        run: python scripts/build_index.py

      - name: Check syntax of scripts
        run: python -m py_compile scripts/build_index.py scripts/pr_reviewer_agent.py
